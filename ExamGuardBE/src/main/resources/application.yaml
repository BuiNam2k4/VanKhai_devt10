server:
  port: 8080
#    định vị microservice

spring:
  datasource:
    url: "jdbc:mysql://localhost:3306/exam_guard"
    username: root
    password: root
    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      encoding: UTF-8
  # SQL tạo các bảng chưa tồn tại; Hibernate kiểm tra mapping entity.

app:
  security:
    jwt-secret: ${JWT_SECRET}
    issuer: examguard
    access-token-ttl: 30m
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
