spring:
  datasource:
    url: jdbc:h2:mem:exam_guard_test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      connection-init-sql: "SET TIME ZONE 'UTC'"
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

jwt:
  signer-key: examguard-test-signing-key-with-more-than-sixty-four-bytes-only-for-tests
  issuer: examguard
  expiration-seconds: 3600

app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
