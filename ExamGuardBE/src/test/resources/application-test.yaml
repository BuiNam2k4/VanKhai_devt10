spring:
  datasource:
    url: jdbc:h2:mem:exam_guard_test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      connection-init-sql: "SET TIME ZONE 'UTC'"
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  security:
    jwt-secret: test-only-secret-at-least-32-bytes-long-never-use-in-production
